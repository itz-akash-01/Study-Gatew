  <section class="card glass" aria-labelledby="card-title">
    <h2 id="card-title" class="sr-only">Log in</h2>
    <form id="login-form" novalidate>
      <div class="field-wrap">
        <label class="field" for="email">
          <span class="field-icon"><svg aria-hidden="true" focusable="false"><use href="#i-mail"/></svg></span>
          <span class="sr-only">Email address</span>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="Email address" aria-describedby="email-err" required>
        </label>
        <p class="err" id="email-err" aria-live="polite"></p>
      </div>
      <div class="field-wrap">
        <div class="field">
          <label class="field-icon" for="password"><svg aria-hidden="true" focusable="false"><use href="#i-lock"/></svg><span class="sr-only">Password</span></label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Password" aria-describedby="password-err" required>
          <button class="toggle" id="toggle-pw" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">
            <svg class="ico-eye" aria-hidden="true" focusable="false"><use href="#i-eye"/></svg>
            <svg class="ico-eye-off" aria-hidden="true" focusable="false"><use href="#i-eye-off"/></svg>
          </button>
        </div>
        <p class="err" id="password-err" aria-live="polite"></p>
      </div>

      <button class="btn btn-primary" id="login-btn" type="submit"><span>Log in</span><svg aria-hidden="true" focusable="false"><use href="#i-arrow"/></svg></button>
      <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>

      <div class="or" aria-hidden="true"><span>or</span></div>

      <a class="btn btn-google" id="google-btn" href="/auth/google" rel="nofollow"><svg aria-hidden="true" focusable="false"><use href="#i-google"/></svg><span>Continue with Google</span></a>

      <nav class="links" aria-label="Account help">
        <a href="#create-account" id="create-link" data-flow="createAccount">Create account <svg aria-hidden="true" focusable="false"><use href="#i-arrow"/></svg></a>
        <a href="#forgot-password" id="forgot-link" data-flow="forgotPassword">Forgot password?</a>
      </nav>
    </form>
  </section>

  <footer class="foot">Your study space, made for you ✨</footer>

<script src="welcome.js" defer></script>
